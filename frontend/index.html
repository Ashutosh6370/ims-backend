<!DOCTYPE html>
<html>
<head>
    <title>IMS Dashboard</title>
    <style>
        body { font-family: Arial; margin: 20px; }

        .incident {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .incident.selected {
            border: 2px solid black;
        }

        .high { background: #ffcccc; }
        .medium { background: #fff3cd; }
        .low { background: #d4edda; }

        .badge {
            padding: 3px 8px;
            border-radius: 5px;
            color: white;
        }

        .OPEN { background: gray; }
        .INVESTIGATING { background: blue; }
        .RESOLVED { background: orange; }
        .CLOSED { background: green; }

        input {
            width: 100%;
            margin: 5px 0;
            padding: 8px;
        }

        button {
            padding: 8px 15px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<h1> Incident Dashboard</h1>
<button onclick="loadIncidents()">Refresh</button>

<h2>Live Incidents</h2>
<div id="incidentList"></div>

<h2>Incident Details</h2>
<div id="details"></div>

<h2>Resolve Incident</h2>
<input id="resolveId" placeholder="component_id">
<button onclick="resolveIncident()">Resolve</button>

<h2>Close Incident (RCA)</h2>
<input id="closeId" placeholder="component_id">
<input id="root" placeholder="root cause">
<input id="fix" placeholder="fix">
<input id="prev" placeholder="prevention">
<button onclick="closeIncident()">Close</button>

<script>
const API = "http://localhost:8000";
let selectedComponent = null;

// -----------------------------
// LOAD INCIDENTS
// -----------------------------
async function loadIncidents() {
    try {
        const res = await fetch(API + "/incidents");

        if (!res.ok) {
            console.error("API failed:", res.status);
            return;
        }

        const data = await res.json();
        console.log("INCIDENTS:", data); // DEBUG

        const container = document.getElementById("incidentList");
        container.innerHTML = "";

        const incidents = Array.isArray(data) ? data : Object.values(data);

        incidents.forEach(inc => {
            const div = document.createElement("div");

            const severity = (inc.signals && inc.signals.length > 0)
                ? inc.signals[inc.signals.length - 1].severity.toLowerCase()
                : "low";

            div.className = "incident " + severity;

            if (inc.component_id === selectedComponent) {
                div.classList.add("selected");
            }

            div.innerHTML = `
                <b>${inc.component_id}</b> |
                ${severity.toUpperCase()} |
                <span class="badge ${inc.status}">${inc.status}</span>
            `;

            div.onclick = () => {
                console.log("CLICKED:", inc); // DEBUG
                selectedComponent = inc.component_id;
                showDetails(inc);
            };

            container.appendChild(div);
        });

        // Auto-select first incident if none selected
        if (!selectedComponent && incidents.length > 0) {
            selectedComponent = incidents[0].component_id;
        }

        // Always refresh details with latest data
        if (selectedComponent) {
            const latest = incidents.find(i => i.component_id === selectedComponent);
            if (latest) {
                showDetails(latest);
            }
        }

        if (incidents.length === 0) {
            document.getElementById("details").innerHTML = "<p>No incidents</p>";
        }

    } catch (err) {
        console.error("Error:", err);
    }
}

// -----------------------------
// SHOW DETAILS
// -----------------------------
function showDetails(inc) {
    const d = document.getElementById("details");

    if (!inc) {
        d.innerHTML = "<p>No data</p>";
        return;
    }

    const signals = (inc.signals && inc.signals.length > 0)
        ? inc.signals.map(s => `<li>${s.message}</li>`).join("")
        : "<li>No signals</li>";

    d.innerHTML = `
        <p><b>Component:</b> ${inc.component_id}</p>
        <p><b>Status:</b> ${inc.status}</p>
        <p><b>Created:</b> ${inc.created_at || "-"}</p>
        <p><b>Closed:</b> ${inc.closed_at || "-"}</p>
        <p><b>MTTR:</b> ${inc.mttr || "-"}</p>

        <h4>Signals:</h4>
        <ul>${signals}</ul>
    `;
}

// -----------------------------
// RESOLVE
// -----------------------------
async function resolveIncident() {
    const id = document.getElementById("resolveId").value;

    if (!id) return alert("Enter component_id");

    const res = await fetch(`${API}/incident/${id}/resolve`, {
        method: "POST"
    });

    if (!res.ok) {
        alert("Resolve failed");
        return;
    }

    alert("Resolved!");

    document.getElementById("resolveId").value = "";

    loadIncidents();
}

// -----------------------------
// CLOSE
// -----------------------------
async function closeIncident() {
    const id = document.getElementById("closeId").value;

    const root = document.getElementById("root").value;
    const fix = document.getElementById("fix").value;
    const prev = document.getElementById("prev").value;

    if (!id || !root || !fix || !prev) {
        return alert("Fill all fields");
    }

    const res = await fetch(`${API}/incident/${id}/close`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            root_cause: root,
            fix: fix,
            prevention: prev
        })
    });

    if (!res.ok) {
        const err = await res.json();
        alert(err.detail);
        return;
    }

    alert("Closed!");

    document.getElementById("closeId").value = "";
    document.getElementById("root").value = "";
    document.getElementById("fix").value = "";
    document.getElementById("prev").value = "";

    loadIncidents();
}

// -----------------------------
// AUTO REFRESH
// -----------------------------
setInterval(loadIncidents, 5000);

// Initial load
loadIncidents();
</script>

</body>
</html>
